[project]
name = "police-ai-assistant"
version = "0.1.0"
description = "Scaffold for the Police AI Assistant platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "supabase>=2.8.0",
  "qdrant-client>=1.10.0",
  "groq>=0.10.0",
  "google-generativeai>=0.8.0",
  "langgraph>=0.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
